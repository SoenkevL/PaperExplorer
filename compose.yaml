# Runs on the tower. Postgres binds to the tower's loopback only: reach it via `ssh -L 5432:localhost:5432 tower`.
# Ollama runs natively on the tower (not in compose); containers reach it at host.docker.internal.
# Langfuse runs beside this stack (compose.langfuse.yaml); containers reach it the same way.
name: paperexplorer

services:
  db:
    image: pgvector/pgvector:pg17
    env_file: .env
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    env_file: .env
    environment:
      PE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PE_EMBEDDING_BASE_URL: http://host.docker.internal:11434/v1
      PE_CHAT_BASE_URL: http://host.docker.internal:11434/v1
      PE_LANGFUSE_BASE_URL: http://host.docker.internal:3000
      PE_LANGFUSE_ENVIRONMENT: tower
      PE_LOG_FORMAT: json
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
    # Healthy once uvicorn answers, so `up --wait` and `web` wait for it, not just for the process.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      start_period: 30s
      start_interval: 1s
      retries: 6
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    env_file: .env
    environment:
      PE_WEB_API_URL: http://api:8000
    ports: ["8080:8080"]
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=2)"]
      interval: 5s
      start_period: 30s
      start_interval: 1s
      retries: 6
    restart: unless-stopped

  grobid:
    # Finds where blocks, References and Citations are in a PDF (ADR 0006). CRF models only:
    # the deep-learning image linked fewer Citations correctly on our corpus.
    image: grobid/grobid:0.9.1-crf
    init: true
    ports: ["127.0.0.1:8070:8070"]
    restart: unless-stopped

  pipeline:
    # One-off runs: docker compose run --rm pipeline run <stage> <zoteroItemKey>
    build: { context: ., dockerfile: docker/pipeline.Dockerfile }
    profiles: [tools]
    env_file: .env
    environment:
      PE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PE_EMBEDDING_BASE_URL: http://host.docker.internal:11434/v1
      PE_GROBID_URL: http://grobid:8070
      PE_LANGFUSE_BASE_URL: http://host.docker.internal:3000
      PE_LANGFUSE_ENVIRONMENT: tower
      PE_DATA_DIR: /data
      PE_ZOTERO_STORAGE_DIR: /zotero/storage
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./data:/data
      # Zotero desktop on the tower syncs PDFs here; mounted read-only.
      - ${ZOTERO_STORAGE_HOST_DIR:-./data/no-zotero}:/zotero/storage:ro
    depends_on:
      db: { condition: service_healthy }
      grobid: { condition: service_started }

volumes:
  pgdata:
