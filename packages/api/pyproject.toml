[project]
name = "paperexplorer-api"
version = "0.1.0"
description = "PaperExplorer JSON API, plus the typed client the web app uses."
requires-python = ">=3.14"
dependencies = [
    "paperexplorer",
    "fastapi>=0.118",
    "uvicorn>=0.37",
    "httpx>=0.28",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"
