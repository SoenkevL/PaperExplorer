      places:
        - heading_path: ["3. Limitations of brain entropy as a biomarker of the psychedelic state and suggestions for refinement", "3.3. One entropy to rule them all?"]
          page: 10
        - heading_path: ["2. Serotonergic psychedelics and brain entropy", "2.5. Previous research on psychedelic-induced brain entropy alterations"]
          page: 5

