[project]
name = "paperexplorer-web"
version = "0.1.0"
description = "PaperExplorer reading interface: server-rendered Jinja + HTMX on top of the API."
requires-python = ">=3.14"
dependencies = [
    "paperexplorer-api",
    "fastapi>=0.118",
    "uvicorn>=0.37",
    "jinja2>=3.1",
    "pydantic-settings>=2.11",
    "httpx>=0.28",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"
