# judge.grounded and judge.correct on its trace (scripts/post_verdicts.py).
# A Pointer's `apt`: apt (its place says what the sentence says), partly (it bears out part of
# the sentence, or a nearby sentence would do better), not (it does not bear the sentence out).
run_id: 20261029T191529Z-94e980b
judge: Claude (stage 8b), each Answer read against the Seed's 105 Chunks as stored on the tower
grounded: >-
  Every claim the Answer makes is borne out by the Seed: by the Chunks its Pointers lead to, and,
  for sentences without a Pointer, by the Chunks the model read (the whole Seed, in the
  baseline). One claim the Seed does not make, or contradicts, makes the Answer ungrounded.
  Unpointed but true sentences are not held against it here: Pointer coverage measures those.
  For an uncovered Question, saying the Seed does not cover it is grounded when that is so.
  A failed turn has no Answer and is neither grounded nor correct.
correct: >-
  The Answer answers the Question rightly per the Seed: its substance is what the Seed says on
  the point asked. A wrong detail off the point asked does not make it incorrect (it makes it
  ungrounded); a wrong or invented statement on the point asked does. An Answer with no content
  is incorrect.
