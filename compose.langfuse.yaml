# Langfuse v4 on the tower: traces of every model call (docs/design-asking.md, Tracing).
#   docker compose -f compose.langfuse.yaml up -d
# A project of its own beside compose.yaml. Only the UI and ingestion port (3000) is published;
# the rest stays on the project's network. Secrets come from .env (LANGFUSE_*, see .env.example).
# Memory limits add up to about 6 GB. Traces are kept until 6 GB on disk or deleted by hand:
# scripts/langfuse_prune.py enforces the cap, so no project retention is set here.
# Adapted from github.com/langfuse/langfuse docker-compose.yml (v4.71.0).
name: paperexplorer-langfuse

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "3" }

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:?set LANGFUSE_NEXTAUTH_URL in .env}
  DATABASE_URL: postgresql://postgres:${LANGFUSE_POSTGRES_PASSWORD:?}@postgres:5432/postgres
  SALT: ${LANGFUSE_SALT:?}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

x-depends-on: &depends-on
  postgres: { condition: service_healthy }
  minio: { condition: service_healthy }
  redis: { condition: service_healthy }
  clickhouse: { condition: service_healthy }

services:
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.71.0
    restart: unless-stopped
    depends_on: *depends-on
    environment: *langfuse-env
    mem_limit: 1g
    logging: *logging

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.71.0
    restart: unless-stopped
    depends_on: *depends-on
    ports: ["3000:3000"]
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?}
      # One project whose API keys are the cloud project's, so the tower and the cloud fallback
      # differ only by URL. Keys added to .env later are added to the project on restart.
      LANGFUSE_INIT_ORG_ID: paperexplorer
      LANGFUSE_INIT_ORG_NAME: PaperExplorer
      LANGFUSE_INIT_PROJECT_ID: paperexplorer
      LANGFUSE_INIT_PROJECT_NAME: PaperExplorer
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${PE_LANGFUSE_PUBLIC_KEY:?}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${PE_LANGFUSE_SECRET_KEY:?}
      # Whoever signs up first owns the project; set LANGFUSE_DISABLE_SIGNUP=true afterwards.
      LANGFUSE_DEFAULT_ORG_ID: paperexplorer
      LANGFUSE_DEFAULT_ORG_ROLE: OWNER
      LANGFUSE_DEFAULT_PROJECT_ID: paperexplorer
      LANGFUSE_DEFAULT_PROJECT_ROLE: OWNER
      AUTH_DISABLE_SIGNUP: ${LANGFUSE_DISABLE_SIGNUP:-false}
    mem_limit: 1536m
    logging: *logging

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./docker/langfuse/clickhouse-logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
    mem_limit: 2560m
    logging: *logging

  minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    entrypoint: sh
    # Creates the 'langfuse' bucket before the server starts.
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:?}
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s
    mem_limit: 384m
    logging: *logging

  redis:
    image: docker.io/redis:7
    restart: unless-stopped
    command: --requirepass ${LANGFUSE_REDIS_PASSWORD:?} --maxmemory-policy noeviction
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    mem_limit: 256m
    logging: *logging

  postgres:
    image: docker.io/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    logging: *logging

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  redis_data:
