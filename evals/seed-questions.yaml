# The eval's Questions about the Seed (Zotero item YAAC9XCX), docs/design-asking.md (Eval).
#
# Written by Claude from the Seed as `parse` and `chunk` read it (113 blocks, 105 Chunks), in the
# format of pydantic-evals' datasets. Each case is one Question:
#   name      its id, `<kind>-<topic>`;
#   inputs    the Question as the reader asks it;
#   metadata  its kind (measurement, method, shortcoming, follow-up, uncovered) and the places a
#             good Answer points at: Heading Path and page exactly as the `chunk` Stage gives
#             them (`heading_path: []` is the text before the first heading, the abstract).
# An uncovered Question lists no places: its Answer should say the Seed does not cover it.
# The Seed's licence is unknown, so nothing here quotes it.
name: seed-questions
cases:
  # Measurements: what the reviewed studies measured and found.
  - name: measurement-table-1-studies
    inputs: How many studies does the review's summary table cover, and which psychedelics did they examine?
    metadata:
      kind: measurement
      places:
        - heading_path: ["2. Serotonergic psychedelics and brain entropy", "2.5. Previous research on psychedelic-induced brain entropy alterations"]
          page: 5
        - heading_path: ["2. Serotonergic psychedelics and brain entropy", "Table 1"]
          page: 6
  - name: measurement-tagliazucchi-motifs
    inputs: How did Tagliazucchi et al. (2014) define brain states under psilocybin, and what did they find?
    metadata:
