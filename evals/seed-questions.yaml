          page: 6
        - heading_path: ["3. Limitations of brain entropy as a biomarker of the psychedelic state and suggestions for refinement", "3.4. Limits to the neurophenomenological equivalence between brain entropy and phenomenal richness"]
          page: 12
  - name: measurement-mcculloch-replication
    inputs: What did McCulloch et al. (2024) find when they tried to replicate the earlier entropy findings?
    metadata:
