# Verdicts on eval run 20261031T192037Z-f349d1e, live asked three times per Question and
# retrieval once, after stage 10a (the Question last, temperature 0.5, no thinking on requests
# without tools, bare [n] handles, a redraft for handles; docs/eval-2026-10-31b.md). No words of
# the Seed or of the Answers: notes are the judge's own. Each verdict is also posted to Langfuse as
# judge.grounded and judge.correct on its trace. A Pointer's `apt`: apt (its place says what the
# sentence says), partly (it bears out part of the sentence, or a nearby sentence would do better),
# not (it does not bear the sentence out). Where parsing lost words (2.5, pages 5-6), an Answer is
# judged by the Chunk as stored, which is what the model read: the user's rule. A redrafted Answer
# is judged as shown, the redraft; its note says whether the redraft changed a claim.
run_id: 20261031T192037Z-f349d1e
judge: Claude (stage 10b), each Answer read against the Seed's 105 Chunks as stored on the tower
grounded: >-
  Every claim the Answer makes is borne out by the Seed: by the Chunks its Pointers lead to, and,
  for sentences without a Pointer, by the Chunks the model read (the whole Seed, when it read the
  whole Seed). One claim the Seed does not make, or contradicts, makes the Answer ungrounded.
  Unpointed but true sentences are not held against it here: Pointer coverage measures those.
  For an uncovered Question, saying the Seed does not cover it is grounded when that is so; saying
  so of a covered Question is a claim the Seed contradicts. Where parsing lost words, the Chunk as
  stored is the Seed. A failed turn has no Answer and is neither grounded nor correct.
correct: >-
  The Answer answers the Question rightly per the Seed: its substance is what the Seed says on
  the point asked. A wrong detail off the point asked does not make it incorrect (it makes it
  ungrounded); a wrong or invented statement on the point asked does, and so does an Answer
  that misses the point asked or answers another Question. An Answer with no content is
  incorrect. Leaked template tokens, stray words in other languages and garbled words are noted,
  not held against correctness.
